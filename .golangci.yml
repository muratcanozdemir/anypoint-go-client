version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    # The analyzers `go fix` applies (Go 1.26+): code must already be in the
    # form `go fix` would leave it. Fix with `make fix`.
    - modernize
    - noctx
    - revive
    - unconvert
  settings:
    modernize:
      disable: [] # every analyzer, as go fix runs them
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck covers these, with the std-error-handling preset
        - G304 # CLI reads files the user names on purpose
  exclusions:
    generated: strict
    presets: [comments, std-error-handling]
    rules:
      # The CLI opens the paths the user passes; names that come from the
      # server go through safeFileName before they are joined to a directory.
      - path: cmd/anypoint/
        linters: [gosec]
        text: G703
      # Test servers and fixtures, not production code paths.
      - path: _test\.go
        linters: [gosec]
