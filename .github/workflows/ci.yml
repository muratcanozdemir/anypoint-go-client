name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Unit tests (race, coverage)
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out -json ./... > test-report.json || {
            grep '"Action":"fail"' test-report.json | head -20; exit 1; }
          go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: |
            coverage.out
            test-report.json

  # The tests also run natively on macOS and Windows: the CLI touches the
  # file system (config, token cache), where the platforms differ.
  unit-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  # The release configuration is valid (every run, seconds). The full snapshot
  # build, every platform built and packaged with nothing published or kept,
  # runs only where it can catch something: the release-please pull request
  # (the last gate before a tag), changes to the release or build configuration
  # or the module graph, OS/arch-specific source files, and manual runs.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3 # keep in sync with release.yml and the Makefile
          args: check
      - id: scope
        name: Snapshot build needed?
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          snapshot=false
          if [[ "$EVENT" == workflow_dispatch || "$HEAD_REF" == release-please--* ]]; then
            snapshot=true
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            snapshot=true # no usable base (new branch, force push): build to be safe
          elif git diff --name-only "$BASE_SHA" HEAD | tee /dev/stderr | grep -qE \
              '^(\.goreleaser\.yaml|go\.mod|go\.sum|\.github/workflows/(ci|release|release-please)\.yml)$|_(windows|darwin|linux|freebsd|netbsd|openbsd|unix|amd64|arm64|arm|386)(_test)?\.go$'; then
            snapshot=true
          fi
          echo "snapshot=$snapshot" | tee -a "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.snapshot == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --skip=publish,sbom

  sonarqube:
    name: SonarQube Cloud analysis
    needs: unit
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame / new-code detection
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
      - name: SonarQube analysis
        # SonarQube Cloud by default; set the SONAR_HOST_URL variable to analyze on
        # another server. The organization comes from the SONAR_ORGANIZATION
        # variable. Skipped without SONAR_TOKEN (e.g. pull requests from forks);
        # fails when the quality gate fails.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}
